# fly.toml — Fly.io deployment config
# Run `fly launch` to create the app, then `fly deploy` to ship.

app = "ai-engineering-journey"
primary_region = "bom"   # Mumbai — change to nearest region

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
